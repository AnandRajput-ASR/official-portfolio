<div
  class="portfolio"
  appReducedMotion
  [class.otw-active]="content.siteSettings.openToWork && !otwDismissed"
  *ngIf="!loading() && !apiError() && content() as content; else loader"
>
  <!-- ═══ HEADER (OTW banner + nav + mobile menu) ═════════════════════════════ -->
  <app-header-section
    [content]="content"
    [resumeInfo]="resumeInfo()"
    [otwDismissed]="otwDismissed"
    [showReviewsLink]="
      content.siteSettings.sections.testimonials !== false && visibleTestimonials().length > 0
    "
    [showWritingLink]="content.siteSettings.sections.blog !== false && publishedPosts().length > 0"
    (dismiss)="dismissOtw()"
    (resumeClick)="handleResumeClick($event)"
  />

  <!-- ═══ HERO ═════════════════════════════════════════════════════════════════ -->
  <app-hero-section
    *ngIf="content.siteSettings.sections.hero !== false"
    [content]="content"
    [resumeInfo]="resumeInfo()"
    (resumeClick)="handleResumeClick($event)"
  />

  <!-- ═══ TICKER ═══════════════════════════════════════════════════════════════ -->
  <app-ticker-section
    *ngIf="content.siteSettings.sections.ticker !== false"
    [items]="tickerItems()"
  />

  <!-- ═══ ABOUT ════════════════════════════════════════════════════════════════ -->
  <app-about-section
    *ngIf="content.siteSettings.sections.about !== false"
    [content]="content"
    (socialClick)="trackSocialClick()"
  />

  <!-- ═══ SKILLS ═══════════════════════════════════════════════════════════════ -->
  <app-skills-section *ngIf="content.siteSettings.sections.skills !== false" [content]="content" />

  <!-- ═══ WORK EXPERIENCE by COMPANY ═══════════════════════════════════════════ -->
  <app-work-section
    *ngIf="content.siteSettings.sections.companies !== false"
    [content]="content"
    [openCompanies]="openCompanies"
    (toggleCompany)="toggleCompany($event)"
  />

  <!-- ═══ PERSONAL & FREELANCE PROJECTS ═══════════════════════════════════════ -->
  <app-personal-projects-section
    *ngIf="content.siteSettings.sections.personalProjects !== false"
    [content]="content"
  />

  <!-- ═══ CERTIFICATIONS ═══════════════════════════════════════════════════════ -->
  <app-certs-section
    *ngIf="
      content.siteSettings.sections.certifications !== false &&
      content.certifications.length > 0
    "
    [content]="content"
  />

  <!-- ═══ EXPERIENCE ═══════════════════════════════════════════════════════════ -->
  <app-experience-section
    *ngIf="content.siteSettings.sections.experience !== false"
    [content]="content"
  />

  <!-- ═══ TESTIMONIALS ═══════════════════════════════════════════════════════ -->
  <app-testimonials-section
    *ngIf="content.siteSettings.sections.testimonials !== false && visibleTestimonials().length > 0"
    [content]="content"
  />

  <!-- ═══ BLOG / WRITING ═════════════════════════════════════════════════════ -->
  <app-blog-section
    *ngIf="content.siteSettings.sections.blog !== false && publishedPosts().length > 0"
    [content]="content"
  />

  <!-- ═══ CURRENTLY LEARNING ════════════════════════════════════════════════════════ -->
  <app-learning-section
    *ngIf="content.siteSettings.learning.enabled && content.siteSettings.learning.items.length"
    [content]="content"
  />

  <!-- ═══ FREELANCE CTA ════════════════════════════════════════════════════════ -->
  <app-freelance-cta-section
    *ngIf="
      content.siteSettings.freelance.enabled &&
      content.siteSettings.freelance.showCtaSection !== false
    "
    [content]="content"
    [resumeInfo]="resumeInfo()"
    (resumeClick)="handleResumeClick($event)"
  />

  <!-- ═══ CONTACT ══════════════════════════════════════════════════════════════ -->
  <app-contact-section *ngIf="content.siteSettings.sections.contact !== false" [content]="content" />

  <!-- ═══ RESUME BANNER ════════════════════════════════════════════════════════ -->
  <app-resume-banner
    *ngIf="content.siteSettings.sections.resumeBanner !== false && resumeInfo()?.available"
    [resumeInfo]="resumeInfo()"
    (resumeClick)="handleResumeClick($event)"
  />

  <!-- ═══ FOOTER ═══════════════════════════════════════════════════════════════ -->
  <app-footer-section
    *ngIf="content.siteSettings.sections.footer !== false"
    [content]="content"
    [visitorCount]="visitorCount()"
    (socialClick)="trackSocialClick()"
  />
</div>

<!-- ═══ RESUME GATE MODAL ═══════════════════════════════════════════════════ -->
<app-resume-gate [(open)]="resumeGateOpen" [source]="resumeGateSource" />

<ng-template #loader>
  <!-- API error state — shown when request fails -->
  <div class="api-error-page" *ngIf="apiError() && !loading(); else skeletonTpl">
    <div class="api-error-card">
      <div class="ae-icon">⚡</div>
      <h2 class="ae-title">Couldn't load portfolio</h2>
      <p class="ae-msg">The server didn't respond. Check your connection or try again.</p>
      <button class="ae-retry" (click)="retryLoad()">↺ Retry</button>
    </div>
  </div>
  <!-- Skeleton screen — shown while loading -->
  <ng-template #skeletonTpl>
    <div class="skeleton-page">
      <!-- Nav skeleton -->
      <div class="sk-nav">
        <div class="sk-block sk-logo"></div>
        <div class="sk-block sk-nav-links"></div>
      </div>
      <!-- Hero skeleton -->
      <div class="sk-hero">
        <div class="sk-hero-left">
          <div class="sk-block sk-badge"></div>
          <div class="sk-block sk-h1-a"></div>
          <div class="sk-block sk-h1-b"></div>
          <div class="sk-block sk-subtitle"></div>
          <div class="sk-pills">
            <div class="sk-block sk-pill"></div>
            <div class="sk-block sk-pill"></div>
            <div class="sk-block sk-pill"></div>
          </div>
          <div class="sk-ctas">
            <div class="sk-block sk-cta"></div>
            <div class="sk-block sk-cta sk-cta-sec"></div>
          </div>
        </div>
        <div class="sk-hero-right">
          <div class="sk-block sk-card"></div>
        </div>
      </div>
    </div>
  </ng-template>
</ng-template>
