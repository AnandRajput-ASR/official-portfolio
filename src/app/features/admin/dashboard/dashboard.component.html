<div class="dirty-bar" *ngIf="dirtyTabCount > 0">
  <span>⚠ Unsaved changes in: {{ getDirtyTabsLabel() }}</span>
</div>

<div class="admin" *ngIf="store.content() !== null; else loader">
  <!-- SHARED: Toast + Confirm Dialog -->
  <app-toast></app-toast>
  <app-confirm-dialog
    [visible]="confirm.visible()"
    [config]="confirm.config()"
    (confirm)="confirm.yes()"
    (cancel)="confirm.no()"
  >
  </app-confirm-dialog>

  <!-- MOBILE TOP BAR (visible <768px) -->
  <div class="mob-topbar">
    <button
      class="mob-hamburger"
      (click)="toggleSidebar()"
      [class.open]="sidebarOpen"
      aria-label="Menu"
    >
      <span></span><span></span><span></span>
    </button>
    <span class="mob-logo">&lt;ADMIN /&gt;</span>
    <button
      class="mob-theme-btn"
      (click)="themeService.toggle()"
      [attr.aria-label]="themeService.isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
    >
      {{ themeService.isDark() ? '☀️' : '🌙' }}
    </button>
  </div>

  <!-- SIDEBAR OVERLAY (mobile) -->
  <div class="sidebar-overlay" [class.open]="sidebarOpen" (click)="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" [class.mob-open]="sidebarOpen">
    <div class="sidebar-logo">&lt;ADMIN /&gt;</div>

    <nav class="sidebar-nav">
      <button [class.active]="activeTab === 'hero'" (click)="mobileSetTab('hero')">
        <span class="tab-icon">👤</span> Hero Section
      </button>
      <button [class.active]="activeTab === 'skills'" (click)="mobileSetTab('skills')">
        <span class="tab-icon">⚡</span> Skills
      </button>
      <button [class.active]="activeTab === 'companies'" (click)="mobileSetTab('companies')">
        <span class="tab-icon">🏢</span> Work / Companies
      </button>
      <button [class.active]="activeTab === 'personal'" (click)="mobileSetTab('personal')">
        <span class="tab-icon">⚡</span> Side Projects
      </button>
      <button [class.active]="activeTab === 'experience'" (click)="mobileSetTab('experience')">
        <span class="tab-icon">📋</span> Timeline
      </button>
      <button [class.active]="activeTab === 'stats'" (click)="mobileSetTab('stats')">
        <span class="tab-icon">📈</span> About Stats
      </button>
      <button
        [class.active]="activeTab === 'certifications'"
        (click)="mobileSetTab('certifications')"
      >
        <span class="tab-icon">🏅</span> Certifications
      </button>
      <button [class.active]="activeTab === 'testimonials'" (click)="mobileSetTab('testimonials')">
        <span class="tab-icon">💬</span> Testimonials
        <span class="unread-badge" *ngIf="store.pendingTestimonials().length > 0">{{
          store.pendingTestimonials().length
        }}</span>
      </button>
      <button [class.active]="activeTab === 'blog'" (click)="mobileSetTab('blog')">
        <span class="tab-icon">✍️</span> Blog / Writing
      </button>
      <button [class.active]="activeTab === 'analytics'" (click)="mobileSetTab('analytics')">
        <span class="tab-icon">📊</span> Analytics
      </button>
      <button [class.active]="activeTab === 'settings'" (click)="mobileSetTab('settings')">
        <span class="tab-icon">⚙️</span> Site Settings
      </button>
      <button [class.active]="activeTab === 'messages'" (click)="mobileSetTab('messages')">
        <span class="tab-icon">✉</span> Messages
        <span class="unread-badge" *ngIf="messagesService.state().unreadCount > 0">{{
          messagesService.state().unreadCount
        }}</span>
      </button>
      <button [class.active]="activeTab === 'resume'" (click)="mobileSetTab('resume')">
        <span class="tab-icon">📄</span> Resume
        <span class="resume-dot" *ngIf="resumeService.info()?.available" title="Resume uploaded"></span>
      </button>
      <button
        [class.active]="activeTab === 'account'"
        (click)="mobileSetTab('account')"
        class="account-btn"
      >
        <span class="tab-icon">🔐</span> Account
        <span class="dirty-dot" *ngIf="store.isDirty('account')"></span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <button
        class="theme-btn"
        (click)="themeService.toggle()"
        [attr.aria-label]="themeService.isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
      >
        <span>{{ themeService.isDark() ? '☀️' : '🌙' }}</span>
        {{ themeService.isDark() ? 'Light Mode' : 'Dark Mode' }}
      </button>
      <a href="/" target="_blank" class="sidebar-link">↗ View Portfolio</a>
      <button class="btn btn-outline btn-sm" (click)="auth.logout()">Logout</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">
    <app-hero-tab *ngIf="activeTab === 'hero'" />
    <app-skills-tab *ngIf="activeTab === 'skills'" />
    <app-companies-tab *ngIf="activeTab === 'companies'" />
    <app-personal-tab *ngIf="activeTab === 'personal'" />
    <app-experience-tab *ngIf="activeTab === 'experience'" />
    <app-certifications-tab *ngIf="activeTab === 'certifications'" />
    <app-testimonials-tab *ngIf="activeTab === 'testimonials'" />
    <app-blog-tab *ngIf="activeTab === 'blog'" />
    <app-analytics-tab *ngIf="activeTab === 'analytics'" />
    <app-settings-tab *ngIf="activeTab === 'settings'" />
    <app-stats-tab *ngIf="activeTab === 'stats'" />
    <app-account-tab *ngIf="activeTab === 'account'" />
    <app-messages-tab *ngIf="activeTab === 'messages'"></app-messages-tab>
    <app-resume-tab *ngIf="activeTab === 'resume'" />
  </main>
</div>

<ng-template #loader>
  <div class="loading-screen">
    <div class="loader-ring"></div>
    <p>Loading admin panel...</p>
  </div>
</ng-template>
